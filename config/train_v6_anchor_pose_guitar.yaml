# V6-A AnchorPoseAdapter guitar-only smoke config.
defaults:
  - train
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='anchor_pose_adaptation',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  anchor_pose_max_delta_t=0.25, anchor_pose_max_delta_q=0.05,
  anchor_pose_num_heads=8, anchor_pose_use_ref_feature=True,
  anchor_pose_apply_rotation=False))

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/src/human3r_896L.pth
pretrained_mhmr: null
load_only_encoder: False

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

train_dataset: 185 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=11, n_corres=0, anchor_cache_root="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R/anchor_cache_guitar_high_overlap_v1", anchor_cache_only=True, anchor_top_k=16) + 185 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=11, n_corres=0, anchor_top_k=16)
val_dataset: 20 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=22, n_corres=0, anchor_cache_root="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R/anchor_cache_guitar_high_overlap_v1", anchor_cache_only=True, anchor_top_k=16) + 20 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=22, n_corres=0, anchor_top_k=16)
test_dataset: 20 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=33, n_corres=0, anchor_cache_root="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R/anchor_cache_guitar_high_overlap_v1", anchor_cache_only=True, anchor_top_k=16) + 20 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="/data/wangzheng/iJCV-CODE/data/RICH_4Human3R", aug_crop=0, resolution=(512, 384), num_views=4, seed=33, n_corres=0, anchor_top_k=16)

batch_size: 1
accum_iter: 1
epochs: 1
num_workers: 0
gradient_checkpointing: true
amp: 1
benchmark: False
fixed_length: True

eval_freq: 0
save_freq: 1
keep_freq: 1
print_freq: 1
print_img_freq: 1000
structured_log_freq: 1
save_code: false

exp_name: v6_anchor_pose_guitar_smoke
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

console_log_keys:
  - lr
  - loss
  - pose_loss
  - shot_boundary_abs_loss
  - shot_jump_rel_loss
  - shot_anchor_loss
  - anchor_pose_gate
  - anchor_pose_delta_t_norm

step_log_keys:
  - loss
  - lr
  - pose_loss
  - pose_loss_view2_AABB
  - shot_boundary_abs_loss
  - shot_boundary_abs_t_err
  - shot_jump_rel_loss
  - shot_jump_t_err
  - shot_anchor_loss
  - shot_anchor_view2_t_err
  - anchor_pose_gate
  - anchor_pose_delta_t_norm
  - anchor_pose_valid
