# V14.1 first-post-cut correction capacity probe.
#
# Input is Kpre=2 context frames plus one explicitly labelled cut event. The
# detector/gate is external: only shot_label=1 inserts correction tokens and
# enables pose/human head LoRA. Only that event frame contributes gradients.
defaults:
  - train
  - _self_

data_root: /data/wangzheng/iJCV-CODE/data
pretrained: /data/wangzheng/iJCV-CODE/Movie3R/checkpoints/v9_mixed_60h_pose_human_lora_bs10/checkpoint-final.pth
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','lbn2':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn2','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr','zxc':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zxc'}"

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt_head_lora',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='PatchEmbedDust3R', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=False,
  v8_pose_prompt_use_gate=False,
  v8_pose_prompt_image_only=True,
  v8_pose_prompt_token_ablation='no_momentum',
  v8_pose_prompt_pooling='mean',
  v9_pre_decoder_change_gate=False,
  v9_oracle_correction_gate=True,
  v9_oracle_correction_cache=False,
  v9_oracle_correction_inference_only=False,
  v9_oracle_correction_post_residual_only=False,
  v8_factorized_human_pose_corr=False,
  v8_human_trans_corr=False,
  v8_human_latent_corr=True,
  v8_human_latent_corr_gate_bias=0.0,
  v8_human_latent_corr_use_gate=False,
  v8_human_latent_corr_gate_mode='shared',
  v8_human_latent_corr_max_delta=1.0,
  v8_human_latent_corr_apply_from_view=-1,
  v8_human_latent_corr_pooling='mean',
  v8_pose_head_lora=True,
  v8_human_head_lora=True,
  v8_head_lora_rank=8,
  v8_head_lora_alpha=8.0,
  v8_head_lora_dropout=0.0,
  v14_1_event_only_head_lora=True,
  v14_1_freeze_unused_prompt_params=True))

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0,
  residual_weight=1.0e-5, drift_weight=0.0, improvement_weight=0.0,
  pose_key='raw_camera_pose', human_trans_weight=10.0,
  human_trans_delta_weight=1.0e-6, human_trans_supervise_from_view=0,
  pose_lora_norm_weight=0.0, human_lora_norm_weight=0.0,
  supervise_shot_label_only=True)
test_criterion: ${train_criterion}

batch_size: 1
num_workers: 0
accum_iter: 1
warmup_epochs: 1
gradient_checkpointing: false
cuda_cache_reserve_mb: 0
cuda_cache_reserve_safety_mb: 0
cuda_cache_reserve_chunk_mb: 512
save_freq: 10
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: false
early_stopping_patience: 1000000
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000
save_code: false
console_log_keys: [lr, loss, avatarrex_loss, thuman_loss, mvhuman100_loss, mvhuman200_loss]
