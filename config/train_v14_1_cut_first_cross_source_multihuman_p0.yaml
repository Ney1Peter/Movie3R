defaults:
  - train_v14_1_cut_event_single_v9_event_only_geometry
  - _self_

# P0 intervention: start from the same formal V9 initialization as cross96,
# retain the four controlled sources, and add only official full-frame
# multi-person camera supervision.  The MultiHuman adapter deliberately has
# no human/mesh loss; its false SMPL mask leaves that term active only on the
# pre-existing controlled sources.
v14_cross_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/versions/v14/cut_first_cross_source/manifests/train96ps
v14_multihuman_camera_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v14_multihuman_camera_supervision_20260803.json
v14_multihuman_camera_root: /data/wangzheng/iJCV-CODE/data/MultiHuman/Real-World-Capture/extracted

# Do not use ``train_datasets`` here: that trainer mode runs *every source* at
# every step, rather than sampling the documented weights.  A single shuffled
# CatDataset gives an exact 20/20/20/20/20 event mix and one optimizer update
# per event.  Each source contributes 96 events/epoch, including a fresh
# deterministic resampling of the 192 real-multi-person events.
train_datasets: null
train_dataset: >-
  96 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14901, n_corres=0, manifest_path="${v14_cross_manifest_root}/avatarrex.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  + 96 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14902, n_corres=0, manifest_path="${v14_cross_manifest_root}/thuman.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  + 96 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14903, n_corres=0, manifest_path="${v14_cross_manifest_root}/mvhuman100.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  + 96 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14904, n_corres=0, manifest_path="${v14_cross_manifest_root}/mvhuman200.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  + 96 @ MultiHumanCameraCut(allow_repeat=True, ROOT="${v14_multihuman_camera_root}", manifest_path="${v14_multihuman_camera_manifest}", manifest_split='train', aug_crop=0, resolution=512, num_views=3, seed=14905, n_corres=0, max_humans=1)

train_mixed_epoch_steps: 0
epochs: 6
eval_freq: 0
val_dataset: null
test_dataset: null
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
early_stopping_patience: 1000000
print_freq: 96

exp_name: v14_cut_first_cross_source_multihuman_p0_e6
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_cut_first_cross_source/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_cut_first_cross_source/${exp_name}
