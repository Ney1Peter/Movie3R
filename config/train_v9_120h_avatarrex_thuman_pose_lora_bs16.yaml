# V9 120h mixed AvatarReX + THuman run: implicit correction + pose-head LoRA.
#
# Planned data:
# - AvatarReX: lbn1 + lbn2 + zzr, 36k AABB + 12k AAAA train clips.
# - THuman: thuman00 + thuman02, 24k AABB + 8k AAAA train clips.
defaults:
  - train_v9_mixed_avatarrex_thuman_60h_pose_lora_bs10
  - _self_

v9_120h_avatarrex_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_120h_avatarrex_lbn1_lbn2_zzr_48k_manifests
v9_120h_thuman_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_120h_thuman00_02_32k_manifests
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','lbn2':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn2','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr','zxc':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zxc'}"

train_datasets:
  - name: avatarrex
    weight: 0.6
    batch_size: 16
    num_workers: 4
    dataset: >-
      36000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9101, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 12000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9102, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.4
    batch_size: 16
    num_workers: 4
    dataset: >-
      24000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9201, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 8000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9202, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 150
batch_size: 16
num_workers: 4
accum_iter: 1
epochs: 200
warmup_epochs: 6
eval_freq: 10

lr: 2.0e-4
min_lr: 1.0e-6
gradient_checkpointing: true
cuda_cache_reserve_mb: 36000
cuda_cache_reserve_safety_mb: 8192
cuda_cache_reserve_chunk_mb: 512

val_dataset:
  - name: avatarrex_aabb
    dataset: >-
      300 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9301, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9302, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      300 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9303, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9304, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

test_dataset:
  - name: avatarrex_aabb
    dataset: >-
      600 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9401, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      200 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9402, n_corres=0, manifest_path="${v9_120h_avatarrex_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      600 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9403, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      200 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9404, n_corres=0, manifest_path="${v9_120h_thuman_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

save_freq: 10
keep_freq: 0
early_stopping_patience: 1000000
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 50
structured_log_freq: 20
print_img_freq: 1000000
save_code: false

exp_name: v9_120h_pose_lora_bs16
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_120h_mixed/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_120h_mixed/${exp_name}
