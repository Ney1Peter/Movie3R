# Conservative pre-decoder gate probe.
#
# Goal:
# - Teach the gate to behave as a shot-change boundary detector, not a
#   "non-first-frame" detector.
# - Use full pattern manifests with stable negatives after frame 0:
#   AAAA, AABB, ABAB, ABBA, AABC, ABCD and 12-frame block/repeat variants.
# - Train with soft routing so a wrong gate directly affects reconstruction loss.
defaults:
  - train_v9_4source_pattern_predecoder_gate_pose_human_lora
  - _self_

v9_pre_decoder_change_gate_bias_value: -2.0
v9_pre_decoder_change_gate_threshold_value: 0.7
v9_pre_decoder_change_gate_teacher_forcing_value: false
v9_pre_decoder_change_gate_soft_route_value: true

train_mixed_epoch_steps: 1
epochs: 61
warmup_epochs: 1
eval_freq: 10
save_freq: 10

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.1, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, drift_target_deadzone=0.05, drift_target_scale=0.45, improvement_margin=0.05, human_trans_weight=10.0, human_trans_delta_weight=1e-06, shot_gate_bce_weight=2.0, shot_gate_pos_weight=1.0, shot_gate_neg_weight=4.0, shot_gate_margin_weight=1.0, shot_gate_stable_margin=0.2, shot_gate_change_margin=0.7, shot_gate_trans_threshold=0.05, shot_gate_rot_threshold_deg=3.0, stable_noop_residual_weight=0.5, stable_raw_consistency_weight=1.0, pose_lora_norm_weight=0.0, human_lora_norm_weight=0.0)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.1, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, drift_target_deadzone=0.05, drift_target_scale=0.45, improvement_margin=0.05, human_trans_weight=10.0, human_trans_delta_weight=1e-06, shot_gate_bce_weight=2.0, shot_gate_pos_weight=1.0, shot_gate_neg_weight=4.0, shot_gate_margin_weight=1.0, shot_gate_stable_margin=0.2, shot_gate_change_margin=0.7, shot_gate_trans_threshold=0.05, shot_gate_rot_threshold_deg=3.0, stable_noop_residual_weight=0.5, stable_raw_consistency_weight=1.0, pose_lora_norm_weight=0.0, human_lora_norm_weight=0.0)

console_log_keys: [lr, loss, avatarrex_4f_loss, avatarrex_long12_loss, thuman_4f_loss, thuman_long12_loss, mvhuman100_4f_loss, mvhuman100_long12_loss, mvhuman200_4f_loss, mvhuman200_long12_loss, v82_pre_decoder_gate_mean, v82_shot_gate_target_mean, v82_shot_gate_bce_loss, v82_shot_gate_margin_loss, v82_stable_noop_residual_loss, v82_stable_raw_consistency_loss]

exp_name: v9_4source_pattern_predecoder_gate_soft_conservative_pose_human_lora
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_pattern_predecoder_gate_soft_conservative/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_pattern_predecoder_gate_soft_conservative/${exp_name}
