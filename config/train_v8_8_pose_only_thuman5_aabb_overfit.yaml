# V8.8 five-clip overfit: pose-only baseline.
#
# This rolls the ablation back to the earlier pose-only setting:
# A_corr_t enters the decoder and only the pose residual branch is supervised.
# The Human3R human head can still output SMPL, but there is no explicit SMPL
# translation correction branch and no human translation loss.
defaults:
  - train_v8_4_mixed_aabb_aaaa_image_only_pose_relation
  - _self_

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_4_train_runs/v8_4_mixed_no_zxc_bs10_long_run1/checkpoint-final.pth

# Disabled from the V8.6/V8.7 pose+human setup; kept here as comments so the
# pose-only rollback is explicit and reversible:
#   v8_human_trans_corr=True
#   v8_human_trans_corr_gate_mode='shared'
#   v8_human_trans_corr_max_delta=3.0
#   v8_human_trans_corr_apply_from_view=-1
#   human_trans_weight=10.0
#   human_trans_delta_weight=1.0e-5
model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=True,
  v8_pose_prompt_use_gate=True,
  v8_pose_prompt_image_only=True,
  v8_human_trans_corr=False))

v8_8_manifest: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/five_clip_thuman_aabb_manifests/train_aabb_60k.jsonl

train_dataset: 5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=901, n_corres=0, manifest_path="${v8_8_manifest}", load_da3_depth=False, raw_calibration_root=None)
val_dataset: 5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=902, n_corres=0, manifest_path="${v8_8_manifest}", load_da3_depth=False, raw_calibration_root=None)
test_dataset: 5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=903, n_corres=0, manifest_path="${v8_8_manifest}", load_da3_depth=False, raw_calibration_root=None)

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.05, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.05, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0)

batch_size: 1
accum_iter: 1
epochs: 100
num_workers: 2
gradient_checkpointing: true
amp: 1
benchmark: false

lr: 5.0e-4
min_lr: 1.0e-6
warmup_epochs: 0
weight_decay: 0.05

eval_freq: 5
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
early_stopping_patience: 1000000
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000

exp_name: v8_8_pose_only_thuman5_aabb_overfit
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_8_pose_only_lora/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_8_pose_only_lora/${exp_name}
