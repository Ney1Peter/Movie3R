# V9 large AvatarReX run: implicit correction + pose-head LoRA.
#
# Data:
# - AvatarReX lbn1 + zzr only.
# - 24k AABB drift clips + 6k AAAA continuous clips.
# - Val/test are held out by frame windows in the manifest metadata.
#
# Runtime target:
# - Single GPU, real batch size 10.
# - Around overnight scale; eval every 2 epochs to keep most time on training.
defaults:
  - train_v9_avatarrex5_implicit_pose_lora
  - _self_

v9_large_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_large_avatarrex_lbn1_zzr_30k_manifests
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr'}"

train_dataset: 24000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1101, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1) + 6000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1102, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
val_dataset: 400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1201, n_corres=0, manifest_path="${v9_large_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1) + 100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1202, n_corres=0, manifest_path="${v9_large_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
test_dataset: 400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1301, n_corres=0, manifest_path="${v9_large_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1) + 100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1302, n_corres=0, manifest_path="${v9_large_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

batch_size: 10
accum_iter: 1
epochs: 6
num_workers: 6
gradient_checkpointing: true

lr: 2.0e-4
min_lr: 1.0e-6
warmup_epochs: 1

eval_freq: 2
save_freq: 1
keep_freq: 2
save_last_checkpoint: true
save_final_checkpoint: true
early_stopping_patience: 1000000

print_freq: 50
structured_log_freq: 20
print_img_freq: 1000000
save_code: false

exp_name: v9_large_avatarrex30k_pose_lora_bs10
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_large_avatarrex30k/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_large_avatarrex30k/${exp_name}
