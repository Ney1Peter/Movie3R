# V9 four-source pre-decoder change-gate probe.
#
# Purpose:
# - Minimal structural change: keep the existing V9 correct token/head path, but
#   add a learned gate before the decoder to decide whether correct tokens should
#   be appended for the current frame.
# - Train on tiny four-source pattern manifests covering 4-frame
#   AAAA/AABB/ABAB/ABBA/AABC/ABCD and 12-frame long-pattern clips.
# - Use batch_size=1 so the hard append/no-append decision is per sequence.
defaults:
  - train_v9_4source_token_probe_pose_human_lora
  - _self_

v9_pattern_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_4source_pattern_probe
v9_long12_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_4source_long12_pattern_probe
v9_pre_decoder_change_gate_bias_value: 2.0

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt_head_lora',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=True,
  v8_pose_prompt_use_gate=True,
  v8_pose_prompt_image_only=True,
  v8_factorized_human_pose_corr=False,
  v8_factorized_human_stopgrad_for_pose=True,
  v8_pose_prompt_token_ablation='all',
  v8_pose_prompt_pooling='mean',
  v9_pre_decoder_change_gate=True,
  v9_pre_decoder_change_gate_threshold=0.5,
  v9_pre_decoder_change_gate_bias=${v9_pre_decoder_change_gate_bias_value},
  v9_pre_decoder_change_gate_force_first_noop=True,
  v8_human_trans_corr=False,
  v8_human_trans_corr_gate_bias=0.0,
  v8_human_trans_corr_use_gate=True,
  v8_human_trans_corr_gate_mode='shared',
  v8_human_trans_corr_max_delta=3.0,
  v8_human_trans_corr_apply_from_view=-1,
  v8_human_latent_corr=True,
  v8_human_latent_corr_gate_bias=0.0,
  v8_human_latent_corr_use_gate=True,
  v8_human_latent_corr_gate_mode='shared',
  v8_human_latent_corr_max_delta=1.0,
  v8_human_latent_corr_apply_from_view=-1,
  v8_human_latent_corr_pooling='mean',
  v8_pose_head_lora=True,
  v8_human_head_lora=True,
  v8_head_lora_rank=8,
  v8_head_lora_alpha=8.0,
  v8_head_lora_dropout=0.0))

train_datasets:
  - name: avatarrex_4f
    weight: 0.15
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=14101, n_corres=0, manifest_path="${v9_pattern_manifest_root}/avatarrex/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_long12
    weight: 0.15
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=14102, n_corres=0, manifest_path="${v9_long12_manifest_root}/avatarrex/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_4f
    weight: 0.125
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=14201, n_corres=0, manifest_path="${v9_pattern_manifest_root}/thuman/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_long12
    weight: 0.125
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=14202, n_corres=0, manifest_path="${v9_long12_manifest_root}/thuman/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100_4f
    weight: 0.125
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=14301, n_corres=0, manifest_path="${v9_pattern_manifest_root}/mvhuman100/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman100_long12
    weight: 0.125
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=14302, n_corres=0, manifest_path="${v9_long12_manifest_root}/mvhuman100/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_4f
    weight: 0.10
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=14401, n_corres=0, manifest_path="${v9_pattern_manifest_root}/mvhuman200/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_long12
    weight: 0.10
    batch_size: 1
    num_workers: 0
    dataset: >-
      AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=14402, n_corres=0, manifest_path="${v9_long12_manifest_root}/mvhuman200/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

train_mixed_epoch_steps: 8
batch_size: 1
num_workers: 0
accum_iter: 1
start_epoch: 1
epochs: 161
warmup_epochs: 2
eval_freq: 20

gradient_checkpointing: false
cuda_cache_reserve_mb: 0
cuda_cache_reserve_safety_mb: 0
cuda_cache_reserve_chunk_mb: 512

test_dataset:
  - name: avatarrex_4f_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=15101, n_corres=0, manifest_path="${v9_pattern_manifest_root}/avatarrex/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_long12_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=15102, n_corres=0, manifest_path="${v9_long12_manifest_root}/avatarrex/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_4f_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=15201, n_corres=0, manifest_path="${v9_pattern_manifest_root}/thuman/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_long12_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=15202, n_corres=0, manifest_path="${v9_long12_manifest_root}/thuman/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100_4f_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=15301, n_corres=0, manifest_path="${v9_pattern_manifest_root}/mvhuman100/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman100_long12_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=15302, n_corres=0, manifest_path="${v9_long12_manifest_root}/mvhuman100/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_4f_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=15401, n_corres=0, manifest_path="${v9_pattern_manifest_root}/mvhuman200/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_long12_all
    dataset: AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=12, seed=15402, n_corres=0, manifest_path="${v9_long12_manifest_root}/mvhuman200/train_all_patterns.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

val_dataset: null

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.1, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, drift_target_deadzone=0.05, drift_target_scale=0.45, improvement_margin=0.05, human_trans_weight=10.0, human_trans_delta_weight=1e-06, shot_gate_bce_weight=0.5, shot_gate_trans_threshold=0.05, shot_gate_rot_threshold_deg=3.0, stable_noop_residual_weight=0.2, stable_raw_consistency_weight=0.5, pose_lora_norm_weight=0.0, human_lora_norm_weight=0.0)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.1, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, drift_target_deadzone=0.05, drift_target_scale=0.45, improvement_margin=0.05, human_trans_weight=10.0, human_trans_delta_weight=1e-06, shot_gate_bce_weight=0.5, shot_gate_trans_threshold=0.05, shot_gate_rot_threshold_deg=3.0, stable_noop_residual_weight=0.2, stable_raw_consistency_weight=0.5, pose_lora_norm_weight=0.0, human_lora_norm_weight=0.0)

save_freq: 20
keep_freq: 0
early_stopping_patience: 1000000
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000
save_code: false
console_log_keys: [lr, loss, avatarrex_4f_loss, avatarrex_long12_loss, thuman_4f_loss, thuman_long12_loss, mvhuman100_4f_loss, mvhuman100_long12_loss, mvhuman200_4f_loss, mvhuman200_long12_loss, v82_pre_decoder_gate_mean, v82_shot_gate_target_mean, v82_shot_gate_bce_loss, v82_stable_noop_residual_loss, v82_stable_raw_consistency_loss]

exp_name: v9_4source_pattern_predecoder_gate_pose_human_lora
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_pattern_predecoder_gate/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_pattern_predecoder_gate/${exp_name}
