# V8.6 single-clip sanity check for explicit SMPL translation correction.
#
# This starts from the successful pose-only THuman overfit checkpoint and trains
# only the V8 correction prompt/residual plus the new SMPL translation head.
defaults:
  - train
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=True,
  v8_pose_prompt_use_gate=True,
  v8_pose_prompt_image_only=True,
  v8_human_trans_corr=True,
  v8_human_trans_corr_gate_bias=0.0,
  v8_human_trans_corr_use_gate=True,
  v8_human_trans_corr_max_delta=1.0))

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/pose_only_thuman00_cam10_cam22_178deg_overfit/checkpoint-best.pth
pretrained_mhmr: null
load_only_encoder: False

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

data_root: /data/wangzheng/iJCV-CODE/data
v8_6_manifest: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/thuman00_cam10_cam22_178deg_manifest.jsonl

train_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=901, n_corres=0, manifest_path="${v8_6_manifest}", load_da3_depth=False, raw_calibration_root=None)
val_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=902, n_corres=0, manifest_path="${v8_6_manifest}", load_da3_depth=False, raw_calibration_root=None)
test_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=4, seed=903, n_corres=0, manifest_path="${v8_6_manifest}", load_da3_depth=False, raw_calibration_root=None)

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-4, drift_weight=0.2, improvement_weight=0.1, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0, human_trans_weight=5.0, human_trans_delta_weight=1.0e-4)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-4, drift_weight=0.2, improvement_weight=0.1, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0, human_trans_weight=5.0, human_trans_delta_weight=1.0e-4)

batch_size: 1
accum_iter: 1
epochs: 40
num_workers: 2
gradient_checkpointing: true
amp: 1
benchmark: False

lr: 5.0e-04
min_lr: 1.0e-06
warmup_epochs: 0
weight_decay: 0.05

eval_freq: 1
save_freq: 5
keep_freq: 5
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000

exp_name: v8_6_human_trans_corr_thuman00_cam10_cam22_178deg_overfit
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/${exp_name}

step_log_keys:
  - loss
  - lr
  - v82_trans_err
  - v82_rot_err_deg
  - v82_raw_trans_err
  - v82_raw_rot_err_deg
  - v82_human_trans_err
  - v82_raw_human_trans_err
  - v82_human_trans_loss
  - v82_human_trans_delta_small_loss
  - v82_gate_mean
  - v82_delta_norm
epoch_log_keys:
  - loss
  - v82_trans_err
  - v82_rot_err_deg
  - v82_raw_trans_err
  - v82_raw_rot_err_deg
  - v82_human_trans_err
  - v82_raw_human_trans_err
  - v82_human_trans_loss
  - v82_human_trans_delta_small_loss
  - v82_gate_mean
  - v82_delta_norm
