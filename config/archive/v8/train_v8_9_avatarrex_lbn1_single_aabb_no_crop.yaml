# V8.9 AvatarReX single-clip overfit with resize-only dataloader input.
#
# Purpose:
# - Check whether the shared-gate pose + human correction branch can overfit one
#   large-angle AvatarReX AABB clip.
# - Keep full image content in the dataloader: resize to a 16-multiple shape,
#   but do not center-crop.
# - Visualize scene pointmap, cameras, and SMPL in the same viewer.
defaults:
  - train_v8_6_joint_gate_pose_human_thuman_overfit
  - _self_

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_6_human_correction_thuman_overfit/v8_6_joint_gate_pose_human_thuman5_aabb_overfit_full_long/checkpoint-final.pth

data_root: /data/wangzheng/iJCV-CODE/data
v8_9_manifest: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_9_avatarrex_single_clip_no_crop/lbn1_22070935_22053926_1671_aabb.jsonl
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','zxc':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zxc','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr'}"

train_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=901, n_corres=0, manifest_path="${v8_9_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})
val_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=902, n_corres=0, manifest_path="${v8_9_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})
test_dataset: 1 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=903, n_corres=0, manifest_path="${v8_9_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.05, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0, human_trans_weight=10.0, human_trans_delta_weight=1.0e-5)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-5, drift_weight=0.05, improvement_weight=0.05, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0, human_trans_weight=10.0, human_trans_delta_weight=1.0e-5)

batch_size: 1
accum_iter: 1
epochs: 100
num_workers: 2
gradient_checkpointing: true
amp: 1
benchmark: false

lr: 5.0e-4
min_lr: 1.0e-6
warmup_epochs: 0
weight_decay: 0.05

eval_freq: 5
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
early_stopping_patience: 1000000
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000

exp_name: v8_9_avatarrex_lbn1_single_aabb_no_crop
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_9_avatarrex_single_clip_no_crop/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_9_avatarrex_single_clip_no_crop/${exp_name}
