# V9 small fixed 7+3 baseline for local loss/model ablations.
#
# Purpose:
# - Keep a tiny, reproducible mixed AvatarReX + THuman correction set.
# - Train the current implicit human-pose correction design with pose+human LoRA.
# - Initialize from the original Human3R checkpoint, not from 60h/120h weights.
# - Stop manually after the training/val loss has stabilized.
defaults:
  - train_v9_120h_avatarrex_thuman_pose_human_lora_bs16
  - _self_

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/src/human3r_896L.pth

v9_small10_avatarrex_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_small10_avatarrex_train_aabb_7.jsonl
v9_small10_thuman_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_small10_thuman_train_aabb_3.jsonl

train_datasets:
  - name: avatarrex
    weight: 0.7
    batch_size: 1
    num_workers: 0
    dataset: >-
      7 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9511, n_corres=0, manifest_path="${v9_small10_avatarrex_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.3
    batch_size: 1
    num_workers: 0
    dataset: >-
      3 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9521, n_corres=0, manifest_path="${v9_small10_thuman_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 7
batch_size: 1
num_workers: 0
accum_iter: 1
epochs: 500
warmup_epochs: 10
eval_freq: 10

lr: 2.0e-4
min_lr: 1.0e-6
gradient_checkpointing: true
cuda_cache_reserve_mb: 0

val_dataset:
  - name: avatarrex_aabb7
    dataset: >-
      7 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9531, n_corres=0, manifest_path="${v9_small10_avatarrex_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb3
    dataset: >-
      3 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9532, n_corres=0, manifest_path="${v9_small10_thuman_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

test_dataset:
  - name: avatarrex_aabb7
    dataset: >-
      7 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9541, n_corres=0, manifest_path="${v9_small10_avatarrex_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb3
    dataset: >-
      3 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=9542, n_corres=0, manifest_path="${v9_small10_thuman_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

save_freq: 10
keep_freq: 0
early_stopping_patience: 1000000
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000
save_code: false

exp_name: v9_small10_pose_human_lora_baseline
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_small10_ablation/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_small10_ablation/${exp_name}
