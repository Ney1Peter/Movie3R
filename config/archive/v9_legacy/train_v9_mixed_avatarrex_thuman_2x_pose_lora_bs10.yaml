# V9 mixed AvatarReX + THuman 2x weekend run: implicit correction + pose-head LoRA.
#
# Compared with train_v9_mixed_avatarrex_thuman_60h_pose_lora_bs10:
# - Uses the larger 30k-per-source manifest pools.
# - Runs a longer weekend schedule: 200 * 100 = 20000 optimizer steps.
# - Keeps batch size, epoch steps, loss, resize mode, source weights, warmup,
#   val/test protocol, eval cadence, and checkpoint policy identical to the
#   current GPU6/GPU7 clean formal run.
defaults:
  - train_v9_mixed_avatarrex_thuman_60h_pose_lora_bs10
  - _self_

v9_60h_avatarrex_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_large_avatarrex_lbn1_zzr_30k_manifests
v9_60h_thuman_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_large_thuman00_02_manifests

train_datasets:
  - name: avatarrex
    weight: 0.6
    batch_size: 16
    num_workers: 4
    dataset: >-
      24000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=7101, n_corres=0, manifest_path="${v9_60h_avatarrex_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 6000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=7102, n_corres=0, manifest_path="${v9_60h_avatarrex_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.4
    batch_size: 16
    num_workers: 4
    dataset: >-
      24000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=7201, n_corres=0, manifest_path="${v9_60h_thuman_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 6000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=7202, n_corres=0, manifest_path="${v9_60h_thuman_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 100
batch_size: 16
num_workers: 4
accum_iter: 1
epochs: 200
warmup_epochs: 4
eval_freq: 6
save_freq: 6
keep_freq: 0
early_stopping_patience: 1000000

exp_name: v9_mixed_2x_same_protocol_pose_lora_bs16_e200
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_2x/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_2x/${exp_name}
