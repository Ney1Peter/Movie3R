# V8.1 small-batch experiment:
# train the UniCon-style decoder-in pose prompt plus the original pose head.
# This is the C variant from the single-sample ablation.
#
# Important:
# - pose target is raw_camera_pose from avatarrex_lbn1/calibration_full.json
# - DA3 pseudo-depth is disabled
# - samples are explicit so train/test is reproducible
defaults:
  - train
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt_pose_head',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_num_body_queries=4, v8_pose_prompt_num_heads=8,
  v8_pose_prompt_dropout=0.0, v8_pose_prompt_gate_bias=0.0))

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/src/human3r_896L.pth
pretrained_mhmr: null
load_only_encoder: False

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

avatarrex_root: /data/wangzheng/iJCV-CODE/data
avatarrex_raw_root: /data/wangzheng/iJCV-CODE/data/avatarrex_lbn1

v8_small_train_samples: "[('22010710', '22053923', 0), ('22010710', '22053923', 120), ('22010710', '22053923', 240), ('22010710', '22053923', 360), ('22010710', '22053923', 480), ('22053907', '22070928', 0), ('22053917', '22053925', 120), ('22010714', '22053926', 240), ('22010716', '22053908', 360), ('22010708', '22070935', 480)]"
v8_small_test_same_samples: "[('22010710', '22053923', 60), ('22010710', '22053923', 180), ('22010710', '22053923', 300), ('22010710', '22053923', 420), ('22010710', '22053923', 540)]"
v8_small_test_new_samples: "[('22053903', '22139907', 0), ('22053912', '22070932', 120), ('22053908', '22053912', 240), ('22053917', '22053923', 360), ('22010710', '22139907', 480)]"

train_dataset: 1000 @ AvatarReX_AABB(allow_repeat=True, split='training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, fixed_samples=${v8_small_train_samples}, load_da3_depth=False, raw_calibration_root="${avatarrex_raw_root}")
val_dataset: 5 @ AvatarReX_AABB(allow_repeat=True, split='training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, fixed_samples=${v8_small_test_same_samples}, load_da3_depth=False, raw_calibration_root="${avatarrex_raw_root}")
test_dataset: 5 @ AvatarReX_AABB(allow_repeat=True, split='training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, fixed_samples=${v8_small_test_new_samples}, load_da3_depth=False, raw_calibration_root="${avatarrex_raw_root}")

train_criterion: V81PosePromptLoss(translation_weight=1.0, rotation_weight=5.0, latent_weight=0.0, gate_weight=0.0, pose_key='raw_camera_pose')
test_criterion: V81PosePromptLoss(translation_weight=1.0, rotation_weight=5.0, latent_weight=0.0, gate_weight=0.0, pose_key='raw_camera_pose')

batch_size: 1
accum_iter: 1
epochs: 1
num_workers: 0
gradient_checkpointing: true
amp: 1
benchmark: False
fixed_length: True

lr: 1.0e-03
min_lr: 1.0e-05
warmup_epochs: 0
weight_decay: 0.0

# Avoid duplicate 4.6G checkpoints in /tmp.
eval_freq: 0
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
print_freq: 20
print_img_freq: 1000000
structured_log_freq: 1
save_code: false

exp_name: v8_1_pose_prompt_posehead_smallbatch_nodepth_rawpose
logdir: /tmp/movie3r_${exp_name}/logs
output_dir: /tmp/movie3r_${exp_name}/

console_log_keys:
  - lr
  - loss
  - v8_pose_prompt_pose_loss
  - v8_pose_prompt_trans_err
  - v8_pose_prompt_rot_err_deg
  - v8_raw_trans_err
  - v8_raw_rot_err_deg
  - v8_pose_prompt_gate_mean
  - v8_pose_prompt_delta_norm

step_log_keys:
  - loss
  - lr
  - v8_pose_prompt_pose_loss
  - v8_pose_prompt_trans_err
  - v8_pose_prompt_rot_err_deg
  - v8_raw_trans_err
  - v8_raw_rot_err_deg
  - v8_pose_prompt_gate_mean
  - v8_pose_prompt_delta_norm
