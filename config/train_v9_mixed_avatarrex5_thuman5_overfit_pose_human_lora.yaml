# V9 mixed-resolution 5+5 clip overfit test.
#
# Purpose:
# - Verify dataset-aware gradient accumulation before the 60h run.
# - Keep AvatarReX and THuman at their own resize_only_16 shapes.
# - Check whether both source losses decrease over ~200 epochs.
#
# Data:
# - 5 AvatarReX AABB large-angle clips.
# - 5 THuman AABB large-angle clips.
defaults:
  - train_v9_mixed_avatarrex_thuman_smoke_pose_human_lora
  - _self_

v9_avatarrex5_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_avatarrex5_train_aabb_5.jsonl
v9_thuman5_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v9_thuman5_train_aabb_5.jsonl

train_datasets:
  - name: avatarrex
    weight: 0.5
    batch_size: 1
    num_workers: 0
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6101, n_corres=0, manifest_path="${v9_avatarrex5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.5
    batch_size: 1
    num_workers: 0
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6201, n_corres=0, manifest_path="${v9_thuman5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 5
batch_size: 1
num_workers: 0
accum_iter: 1
epochs: 200
warmup_epochs: 10
eval_freq: 10
save_freq: 1000000
keep_freq: 50
early_stopping_patience: 1000000
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 1
structured_log_freq: 1
print_img_freq: 1000000

val_dataset:
  - name: avatarrex_aabb5
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6301, n_corres=0, manifest_path="${v9_avatarrex5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb5
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6302, n_corres=0, manifest_path="${v9_thuman5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

test_dataset:
  - name: avatarrex_aabb5
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6401, n_corres=0, manifest_path="${v9_avatarrex5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb5
    dataset: >-
      5 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=6402, n_corres=0, manifest_path="${v9_thuman5_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

exp_name: v9_mixed_avatarrex5_thuman5_overfit_pose_human_lora
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_avatarrex_thuman_overfit/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_avatarrex_thuman_overfit/${exp_name}
