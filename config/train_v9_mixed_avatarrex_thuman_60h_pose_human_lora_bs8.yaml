# V9 mixed AvatarReX + THuman long run draft.
#
# Main goal:
# - Keep original no-crop resize_only_16 for each dataset.
# - Avoid 512x512 padding artifacts.
# - Train one shared model with source-aware weighted gradient accumulation.
#
# Runtime estimate:
# - 800 mixed optimizer steps / epoch.
# - Each step runs AvatarReX bs=8 and THuman bs=8, then one optimizer step.
# - 30 epochs is intended to land around the 55-65 hour range, depending on
#   GPU availability and eval overhead.
defaults:
  - train_v9_large_avatarrex30k_pose_human_lora_bs10
  - _self_

thuman_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_large_thuman00_02_manifests

train_datasets:
  - name: avatarrex
    weight: 0.6
    batch_size: 8
    num_workers: 4
    dataset: >-
      4800 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5101, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 1600 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5102, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.4
    batch_size: 8
    num_workers: 4
    dataset: >-
      4800 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5201, n_corres=0, manifest_path="${thuman_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 1600 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5202, n_corres=0, manifest_path="${thuman_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 800
batch_size: 8
num_workers: 4
accum_iter: 1
epochs: 30
warmup_epochs: 2
eval_freq: 2
save_freq: 1
keep_freq: 5
early_stopping_patience: 1000000
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 50
structured_log_freq: 20
print_img_freq: 1000000

val_dataset:
  - name: avatarrex_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5301, n_corres=0, manifest_path="${v9_large_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5302, n_corres=0, manifest_path="${v9_large_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5303, n_corres=0, manifest_path="${thuman_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5304, n_corres=0, manifest_path="${thuman_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

test_dataset:
  - name: avatarrex_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5401, n_corres=0, manifest_path="${v9_large_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5402, n_corres=0, manifest_path="${v9_large_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5403, n_corres=0, manifest_path="${thuman_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=5404, n_corres=0, manifest_path="${thuman_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

exp_name: v9_mixed_avatarrex_thuman_60h_pose_human_lora_bs8
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_avatarrex_thuman_60h/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_mixed_avatarrex_thuman_60h/${exp_name}
