defaults:
  - train_v14_1_cut_event
  - _self_

v14_1_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v14_1_cut_event/ten

train_datasets:
  - name: avatarrex
    weight: 0.30
    batch_size: 1
    num_workers: 0
    dataset: >-
      3 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14201, n_corres=0, manifest_path="${v14_1_manifest_root}/avatarrex.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.20
    batch_size: 1
    num_workers: 0
    dataset: >-
      2 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14202, n_corres=0, manifest_path="${v14_1_manifest_root}/thuman.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100
    weight: 0.30
    batch_size: 1
    num_workers: 0
    dataset: >-
      3 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14203, n_corres=0, manifest_path="${v14_1_manifest_root}/mvhuman100.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200
    weight: 0.20
    batch_size: 1
    num_workers: 0
    dataset: >-
      2 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14204, n_corres=0, manifest_path="${v14_1_manifest_root}/mvhuman200.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

train_mixed_epoch_steps: 10
epochs: 12
eval_freq: 4
val_dataset: null
test_dataset:
  - name: v14_1_ten_avatarrex
    dataset: >-
      3 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14211, n_corres=0, manifest_path="${v14_1_manifest_root}/avatarrex.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: v14_1_ten_thuman
    dataset: >-
      2 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14212, n_corres=0, manifest_path="${v14_1_manifest_root}/thuman.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: v14_1_ten_mvhuman100
    dataset: >-
      3 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14213, n_corres=0, manifest_path="${v14_1_manifest_root}/mvhuman100.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: v14_1_ten_mvhuman200
    dataset: >-
      2 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14214, n_corres=0, manifest_path="${v14_1_manifest_root}/mvhuman200.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

exp_name: v14_1_cut_event_ten_sequences
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_1/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_1/${exp_name}
