# V9 four-source angle>=60: pose concat + human concat, AvatarReX-weighted.
#
# Purpose:
# - Keep the better-generalizing pose concat pooling.
# - Also let the human latent correction head see all refined correct-token slots
#   through concat_mlp instead of collapsing them with mean pooling.
# - Increase AvatarReX training contribution and validation monitor weight because
#   AvatarReX remained the hardest/highest-loss source in the previous run.
#
# Difference from train_v9_4source_angle60_pose_concat_human_mean_lora_bs10:
# - v8_human_latent_corr_pooling='concat_mlp'
# - train source weights: AvatarReX 0.45, THuman 0.20, MVHuman100 0.20, MVHuman200 0.15
# - val_monitor_weights gives AvatarReX 2x weight for best checkpoint / early stopping
defaults:
  - train_v9_4source_angle60_pose_concat_human_mean_lora_bs10
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt_head_lora',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=True,
  v8_pose_prompt_use_gate=True,
  v8_pose_prompt_image_only=True,
  v8_pose_prompt_pooling='concat_mlp',
  v8_human_trans_corr=False,
  v8_human_trans_corr_gate_bias=0.0,
  v8_human_trans_corr_use_gate=True,
  v8_human_trans_corr_gate_mode='shared',
  v8_human_trans_corr_max_delta=3.0,
  v8_human_trans_corr_apply_from_view=-1,
  v8_human_latent_corr=True,
  v8_human_latent_corr_gate_bias=0.0,
  v8_human_latent_corr_use_gate=True,
  v8_human_latent_corr_gate_mode='shared',
  v8_human_latent_corr_max_delta=1.0,
  v8_human_latent_corr_apply_from_view=-1,
  v8_human_latent_corr_pooling='concat_mlp',
  v8_pose_head_lora=True,
  v8_human_head_lora=True,
  v8_head_lora_rank=8,
  v8_head_lora_alpha=8.0,
  v8_head_lora_dropout=0.0))

train_datasets:
  - name: avatarrex
    weight: 0.45
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8101, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8102, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.20
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8201, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8202, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100
    weight: 0.20
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8301, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/train_aabb_60k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8302, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200
    weight: 0.15
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8401, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/train_aabb_60k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8402, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

val_monitor_weights:
  avatarrex: 2.0
  thuman: 1.0
  mvhuman100: 1.0
  mvhuman200: 1.0

exp_name: v9_4source_angle60_pose_human_concat_avatarrex_weighted_lora_bs10
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_angle60_pooling_ablation/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_angle60_pooling_ablation/${exp_name}
