# V9 four-source angle>=60 baseline: pose + human latent correction with pose/human LoRA.
#
# Purpose:
# - Train the current standard V9 model on AvatarReX, THuman, MVHuman100 and MVHuman200.
# - Prefer large-view-change AABB clips while keeping AAAA clips to teach the learned gate
#   not to over-correct continuous sequences.
# - Keep each source in its own batch so resize_only_16 preserves native aspect ratio.
# - Start from the original Human3R checkpoint, not from previous V9 weights.
defaults:
  - train_v9_mixed_avatarrex_thuman_60h_pose_human_lora_bs10
  - _self_

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/src/human3r_896L.pth

v9_4source_avatarrex_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_baseline_avatarrex_lbn1_lbn2_zzr_angle60_manifests
v9_4source_thuman_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_baseline_thuman00_02_angle60_manifests
v9_4source_mvhuman100_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_baseline_mvhuman100_angle60_manifests
v9_4source_mvhuman200_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_baseline_mvhuman200_angle60_manifests
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','lbn2':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn2','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr','zxc':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zxc'}"

train_datasets:
  - name: avatarrex
    weight: 0.30
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8101, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8102, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman
    weight: 0.25
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8201, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8202, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100
    weight: 0.25
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8301, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/train_aabb_60k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8302, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200
    weight: 0.20
    batch_size: 10
    num_workers: 4
    dataset: >-
      8000 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8401, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/train_aabb_60k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
      + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8402, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

train_mixed_epoch_steps: 80
batch_size: 10
num_workers: 4
accum_iter: 1
epochs: 200
warmup_epochs: 6
eval_freq: 10

lr: 2.0e-4
min_lr: 1.0e-6
gradient_checkpointing: true
cuda_cache_reserve_mb: 36000
cuda_cache_reserve_safety_mb: 8192
cuda_cache_reserve_chunk_mb: 512

val_dataset:
  - name: avatarrex_aabb
    dataset: >-
      200 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8501, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      50 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8502, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      200 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8503, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/val_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      50 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8504, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100_aabb
    dataset: >-
      200 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8505, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/val_aabb_2k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman100_aaaa
    dataset: >-
      50 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8506, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_aabb
    dataset: >-
      200 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8507, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/val_aabb_2k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_aaaa
    dataset: >-
      50 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8508, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/val_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

test_dataset:
  - name: avatarrex_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8601, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: avatarrex_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8602, n_corres=0, manifest_path="${v9_4source_avatarrex_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8603, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/test_aabb_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: thuman_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8604, n_corres=0, manifest_path="${v9_4source_thuman_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  - name: mvhuman100_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8605, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/test_aabb_2k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman100_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8606, n_corres=0, manifest_path="${v9_4source_mvhuman100_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_aabb
    dataset: >-
      400 @ AvatarReX_AABB(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8607, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/test_aabb_2k.jsonl", pair_scope='same_parent', load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  - name: mvhuman200_aaaa
    dataset: >-
      100 @ AvatarReX_Video(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=8608, n_corres=0, manifest_path="${v9_4source_mvhuman200_manifest_root}/test_aaaa_1k.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)

save_freq: 10
keep_freq: 0
early_stopping_patience: 50
save_last_checkpoint: true
save_final_checkpoint: true
print_freq: 40
structured_log_freq: 10
print_img_freq: 1000000
save_code: false
console_log_keys: [lr, loss, avatarrex_loss, thuman_loss, mvhuman100_loss, mvhuman200_loss]

exp_name: v9_4source_angle60_baseline_pose_human_lora_bs10
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_angle60_baseline/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_4source_angle60_baseline/${exp_name}
