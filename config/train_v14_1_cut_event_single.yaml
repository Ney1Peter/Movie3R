defaults:
  - train_v14_1_cut_event
  - _self_

v14_1_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v14_1_cut_event/single/lbn1_1192.jsonl

train_datasets:
  - name: avatarrex
    weight: 1.0
    batch_size: 1
    num_workers: 0
    dataset: >-
      1 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14101, n_corres=0, manifest_path="${v14_1_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

train_mixed_epoch_steps: 1
epochs: 40
eval_freq: 10
val_dataset: null
test_dataset:
  - name: v14_1_single
    dataset: >-
      1 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=14102, n_corres=0, manifest_path="${v14_1_manifest}", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

exp_name: v14_1_cut_event_single_lbn1_1192
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_1/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_1/${exp_name}
