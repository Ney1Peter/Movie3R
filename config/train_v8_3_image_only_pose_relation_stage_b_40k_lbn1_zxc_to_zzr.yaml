# V8.3 Stage-B image-only pose relation prompt.
#
# Difference from V8.2:
# - the loss still uses AvatarReX GT pose/SMPL for supervision;
# - model forward is sanitized to image-only inputs;
# - Human tokens are generated by the same detector path used at inference;
# - ray_map/ray_mask, shot_label, GT pose, GT SMPL and GT depth are not visible
#   to the model forward.
defaults:
  - train
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='v8_pose_prompt',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  v8_pose_prompt_variant='relation_v8_2',
  v8_pose_prompt_num_heads=8, v8_pose_prompt_dropout=0.0,
  v8_pose_prompt_gate_bias=0.0,
  v8_pose_prompt_use_history=True,
  v8_pose_prompt_use_pose_memory=True,
  v8_pose_prompt_use_reliability=True,
  v8_pose_prompt_use_gate=True,
  v8_pose_prompt_image_only=True))

pretrained: /data/wangzheng/iJCV-CODE/Movie3R/src/human3r_896L.pth
pretrained_mhmr: null
load_only_encoder: False

num_views: 4
num_test_views: 4
n_corres_train: 0
n_corres_test: 0

avatarrex_root: /data/wangzheng/iJCV-CODE/data
v8_stage_b_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_1_aabb_manifests/stage_b_40k
avatarrex_raw_roots: "{'lbn1':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/lbn1','zxc':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zxc','zzr':'/data/wangzheng/iJCV-CODE/data/AvatarReX_raw_meta/zzr'}"

train_dataset: 40000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, manifest_path="${v8_stage_b_manifest_root}/stage_b_train_40k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})
val_dataset: 500 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, manifest_path="${v8_stage_b_manifest_root}/stage_b_val_in_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})
test_dataset: 500 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${avatarrex_root}", aug_crop=0, resolution=(512, 288), num_views=4, seed=101, n_corres=0, manifest_path="${v8_stage_b_manifest_root}/stage_b_test_new_zzr_2k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots})

train_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-4, drift_weight=0.2, improvement_weight=0.1, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0)
test_criterion: V82PoseRelationLoss(translation_weight=1.0, rotation_weight=5.0, residual_weight=1.0e-4, drift_weight=0.2, improvement_weight=0.1, pose_key='raw_camera_pose', drift_trans_scale=0.5, drift_rot_scale_deg=45.0, improvement_margin=0.0)

batch_size: 1
accum_iter: 1
epochs: 1
num_workers: 2
gradient_checkpointing: true
amp: 1
benchmark: False
fixed_length: True

lr: 1.0e-03
min_lr: 1.0e-05
warmup_epochs: 0
weight_decay: 0.0

eval_freq: 1
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
print_freq: 50
print_img_freq: 1000000
structured_log_freq: 20
save_code: false

exp_name: v8_3_image_only_pose_relation_stage_b_40k_lbn1_zxc_to_zzr
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_3_train_runs/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v8_3_train_runs/${exp_name}

console_log_keys:
  - lr
  - loss
  - v82_pose_loss
  - v82_trans_err
  - v82_rot_err_deg
  - v82_raw_trans_err
  - v82_raw_rot_err_deg
  - v82_gate_mean
  - v82_drift_target_mean
  - v82_drift_loss
  - v82_delta_norm
  - v82_norm_error_improvement

step_log_keys:
  - loss
  - lr
  - v82_pose_loss
  - v82_trans_err
  - v82_rot_err_deg
  - v82_raw_trans_err
  - v82_raw_rot_err_deg
  - v82_gate_mean
  - v82_drift_target_mean
  - v82_drift_loss
  - v82_delta_norm
  - v82_norm_error_improvement
