defaults:
  - train_v14_1_cut_event_single_v9_event_only_geometry
  - _self_

# P0.1 is the only follow-up to the strict P0 gate.  It changes training-data
# mixture only: increase real full-frame multi-human camera supervision from
# 20% to one third, while retaining all four controlled sources.  Architecture,
# formal-V9 initialization, first-post routing, loss weights, resolution,
# total updates and final-only checkpoint selection are identical to P0.
#
# This is selected *before* re-opening any final-confirmation result: P0
# improved camera/W but left a fixed-root/pair-layout tradeoff on the frozen
# EgoHumans confirmation.  No BRTC/Kabsch/gate/selector parameter is touched.
v14_cross_manifest_root: /data/wangzheng/iJCV-CODE/Movie3R/versions/v14/cut_first_cross_source/manifests/train96ps
v14_multihuman_camera_manifest: /data/wangzheng/iJCV-CODE/Movie3R/config/manifests/v14_multihuman_camera_supervision_20260803.json
v14_multihuman_camera_root: /data/wangzheng/iJCV-CODE/data/MultiHuman/Real-World-Capture/extracted

# One shuffled CatDataset is essential: ``train_datasets`` would iterate every
# source per optimizer step and silently alter the documented ratio.  The
# epoch remains exactly 480 updates, but its fixed composition is now
# AvatarReX/THuman/MVHuman100/MVHuman200/MultiHuman = 80/80/80/80/160.
train_datasets: null
train_dataset: >-
  80 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=15901, n_corres=0, manifest_path="${v14_cross_manifest_root}/avatarrex.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  + 80 @ AvatarReX_Pattern(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=15902, n_corres=0, manifest_path="${v14_cross_manifest_root}/thuman.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)
  + 80 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=15903, n_corres=0, manifest_path="${v14_cross_manifest_root}/mvhuman100.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  + 80 @ AvatarReX_Pattern(allow_repeat=True, split='Training/mvhuman', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='human3r_demo', num_views=3, seed=15904, n_corres=0, manifest_path="${v14_cross_manifest_root}/mvhuman200.jsonl", load_da3_depth=False, raw_calibration_root=None, max_humans=1)
  + 160 @ MultiHumanCameraCut(allow_repeat=True, ROOT="${v14_multihuman_camera_root}", manifest_path="${v14_multihuman_camera_manifest}", manifest_split='train', aug_crop=0, resolution=512, num_views=3, seed=15905, n_corres=0, max_humans=1)

train_mixed_epoch_steps: 0
epochs: 6
eval_freq: 0
val_dataset: null
test_dataset: null
save_freq: 1000000
keep_freq: 0
save_last_checkpoint: false
save_final_checkpoint: true
early_stopping_patience: 1000000
print_freq: 96

exp_name: v14_cut_first_cross_source_multihuman_p0_r33_e6
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_cut_first_cross_source/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v14_cut_first_cross_source/${exp_name}
