# V6-C Pose-only AnchorToken single-sample overfit gate.
# AnchorTokens are built from boundary patch evidence but do not enter full decoder attention.
# The final decoder pose token alone cross-attends AnchorTokens before the downstream head.
defaults:
  - train_v6_anchor_decoder_overfit
  - _self_

model: ARCroco3DStereo(ARCroco3DStereoConfig(freeze='anchor_pose_token_adaptation',
  state_size=768, state_pe='2d', pos_embed='RoPE100',
  rgb_head=True, pose_head=True, msk_head=True, patch_embed_cls='ManyAR_PatchEmbed', img_size=(512,
  512), head_type='dpt', output_mode='pts3d+pose+smpl', depth_mode=('exp', -inf, inf),
  conf_mode=('exp', 1, inf), pose_mode=('exp', -inf, inf), enc_embed_dim=1024, enc_depth=24,
  enc_num_heads=16, dec_embed_dim=768, dec_depth=12, dec_num_heads=12, landscape_only=False,
  backbone='dinov2_vitl14', mhmr_img_res=896, lora_rank=64, shot_loss_weight=0.0,
  shot_q0_loss_weight=0.0, shot_scale_init=0.0, shot_noop_loss_weight=0.0,
  pose_delta_t_max=0.5, pose_align_delta_t_max=0.25, pose_align_delta_q_max=0.05,
  shot_pointmap_keep_loss_weight=0.0, shot_pose_residual_loss_weight=0.0,
  shot_pose_layers='none', layerwise_pose_shot_scale_init=0.0,
  anchor_pose_max_delta_t=1.0, anchor_pose_max_delta_q=0.05,
  anchor_pose_num_heads=8, anchor_pose_use_ref_feature=True,
  anchor_pose_apply_rotation=False,
  anchor_decoder_use_ref_feature=True, anchor_decoder_token_scale_init=0.05,
  anchor_pose_token_delta_scale_init=0.1))

exp_name: v6_anchor_pose_token_overfit_cam01_cam02_start35
logdir: ./${save_dir}/${exp_name}/logs
output_dir: ./${save_dir}/${exp_name}/

console_log_keys:
  - lr
  - loss
  - pose_loss_view2_AABB
  - shot_anchor_view2_t_err
  - shot_jump_t_err
  - anchor_decoder_gate
  - anchor_decoder_token_norm
  - anchor_pose_token_delta_norm

step_log_keys:
  - loss
  - lr
  - pose_loss
  - pose_loss_view2_AABB
  - shot_boundary_abs_loss
  - shot_boundary_abs_t_err
  - shot_jump_rel_loss
  - shot_jump_t_err
  - shot_anchor_loss
  - shot_anchor_view2_t_err
  - anchor_decoder_gate
  - anchor_decoder_valid
  - anchor_decoder_token_norm
  - anchor_pose_token_gate
  - anchor_pose_token_valid
  - anchor_pose_token_delta_norm
  - anchor_pose_token_attn_max
