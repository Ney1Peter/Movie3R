# V9 AvatarReX convergence run: implicit correction + pose-head LoRA.
#
# Smaller data, more epochs:
# - 8k AABB drift clips + 2k AAAA continuous clips
# - 10 epochs, real batch size 16
defaults:
  - train_v9_large_avatarrex30k_pose_lora_bs10
  - _self_

train_dataset: 8000 @ AvatarReX_AABB(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1101, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aabb_60k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1) + 2000 @ AvatarReX_Video(allow_repeat=True, split='Training', ROOT="${data_root}", aug_crop=0, resolution=512, resize_mode='resize_only_16', num_views=4, seed=1102, n_corres=0, manifest_path="${v9_large_manifest_root}/train_aaaa_20k.jsonl", load_da3_depth=False, raw_calibration_root=${avatarrex_raw_roots}, max_humans=1)

batch_size: 16
num_workers: 4
epochs: 10
warmup_epochs: 1
eval_freq: 2
save_freq: 2
keep_freq: 5
early_stopping_patience: 1000000

exp_name: v9_avatarrex10k_e10_pose_lora_bs16
logdir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_avatarrex10k_e10/${exp_name}/logs
output_dir: /data/wangzheng/iJCV-CODE/Movie3R/output/v9_avatarrex10k_e10/${exp_name}
