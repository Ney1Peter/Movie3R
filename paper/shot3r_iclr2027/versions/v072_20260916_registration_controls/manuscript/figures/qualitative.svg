<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <style>
      .title{font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700;fill:#0F172A}
      .subtitle{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#475569}
      .head{font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#0F172A}
      .text{font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#334155}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#475569}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}
      .box{fill:#FFFFFF;stroke:#64748B;stroke-width:2.3}
    </style>
  </defs>
  <rect width="1800" height="700" fill="#F8FAFC"/>
  <text x="900" y="48" text-anchor="middle" class="title">Evaluation view for an edited multi-person stream</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Protocol schematic, not a rendered reconstruction. Every method receives the same pre-cut and post-cut observations.</text>

  <rect x="40" y="115" width="520" height="520" rx="20" class="panel"/>
  <text x="70" y="157" class="head">(a) Fixed boundary segment</text>
  <text x="70" y="184" class="text">A shared cut and identical RGB observations define each trial.</text>
  <g transform="translate(78 235)">
    <rect x="0" y="0" width="115" height="90" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <rect x="134" y="0" width="115" height="90" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <rect x="300" y="0" width="115" height="90" rx="10" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
    <rect x="434" y="0" width="0" height="90" fill="none"/>
    <g fill="#1D4ED8"><circle cx="33" cy="36" r="12"/><circle cx="82" cy="38" r="12"/><path d="M18 75 C24 50,43 50,49 75M67 75 C73 51,91 51,97 75"/></g>
    <g fill="#1D4ED8"><circle cx="167" cy="35" r="12"/><circle cx="216" cy="38" r="12"/><path d="M152 75 C158 50,177 50,183 75M201 75 C207 51,225 51,231 75"/></g>
    <g fill="#9D174D"><circle cx="332" cy="38" r="12"/><circle cx="381" cy="37" r="12"/><path d="M317 75 C323 51,342 51,348 75M366 75 C372 50,390 50,396 75"/></g>
    <text x="57" y="116" text-anchor="middle" class="small">pre-cut</text><text x="191" y="116" text-anchor="middle" class="small">pre-cut</text><text x="358" y="116" text-anchor="middle" class="small">post-cut</text>
    <path d="M270 -24 V134" stroke="#7C3AED" stroke-width="4" stroke-dasharray="9 7"/>
    <text x="270" y="-35" text-anchor="middle" class="small">view cut</text>
  </g>
  <rect x="78" y="410" width="444" height="137" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="300" y="449" text-anchor="middle" class="head">Frozen evaluation contract</text>
  <text x="300" y="480" text-anchor="middle" class="text">same frames • same identities • same post-cut horizon</text>
  <text x="300" y="509" text-anchor="middle" class="text">paired camera, body, coverage, and association reporting</text>
  <path d="M560 374 H635" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="650" y="115" width="520" height="520" rx="20" class="panel"/>
  <text x="680" y="157" class="head">(b) Strict Human3R branch</text>
  <text x="680" y="184" class="text">Baseline evaluation without a supplied boundary event.</text>
  <rect x="704" y="237" width="410" height="82" rx="13" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2.3"/>
  <text x="909" y="270" text-anchor="middle" class="head">Streaming reconstruction state</text>
  <text x="909" y="296" text-anchor="middle" class="small">continuous state handling across the input stream</text>
  <path d="M909 319 V378" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="704" y="393" width="410" height="120" rx="13" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2.3"/>
  <text x="909" y="429" text-anchor="middle" class="head">Recorded prediction payload</text>
  <text x="909" y="458" text-anchor="middle" class="text">camera and human estimates, identities, confidences</text>
  <text x="909" y="485" text-anchor="middle" class="small">scored only under the shared evaluation contract</text>
  <path d="M1170 374 H1245" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1260" y="115" width="500" height="520" rx="20" class="panel"/>
  <text x="1290" y="157" class="head">(c) Bridge3R branch</text>
  <text x="1290" y="184" class="text">Boundary-aware causal state handling on the identical stream.</text>
  <rect x="1308" y="227" width="404" height="73" rx="13" fill="#ECFDF5" stroke="#34D399" stroke-width="2.3"/>
  <text x="1510" y="257" text-anchor="middle" class="head">Clean reset + read-only proposal</text>
  <text x="1510" y="282" text-anchor="middle" class="small">new state owns the post-cut future</text>
  <path d="M1510 300 V347" stroke="#2563EB" stroke-width="3" marker-end="url(#blue)"/>
  <rect x="1308" y="362" width="404" height="73" rx="13" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2.3"/>
  <text x="1510" y="392" text-anchor="middle" class="head">Gauge, association, typed correction</text>
  <text x="1510" y="417" text-anchor="middle" class="small">validate evidence before causal commit</text>
  <path d="M1510 435 V482" stroke="#2563EB" stroke-width="3" marker-end="url(#blue)"/>
  <rect x="1308" y="497" width="404" height="72" rx="13" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.3"/>
  <text x="1510" y="527" text-anchor="middle" class="head">Recorded prediction payload</text>
  <text x="1510" y="552" text-anchor="middle" class="small">reported with exactly the same metrics and horizon</text>
  <text x="900" y="678" text-anchor="middle" class="subtitle">This view documents a controlled comparison protocol; final rendered examples are inserted only after their corresponding artifacts are frozen and audited.</text>
</svg>
