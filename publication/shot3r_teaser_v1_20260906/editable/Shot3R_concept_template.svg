<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="880" viewBox="0 0 1800 880">
<title>Shot3R conceptual layout / 生成式概念图的可编辑排版模板</title>
<desc>纯概念排版模板，并非实验输出。可替换为明确标注的生成式插画。三镜头仅用于说明任务，不代表已有三镜头结果。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="#657685" stroke-width="1.8"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="30" y="52" font-family="Arial, Liberation Sans, sans-serif" font-size="43" fill="#172d3d" font-weight="700" text-anchor="start">Shot3R</text>
<!-- Streaming reconstruction across shot changes：跨镜头切换的流式重建 -->
<text x="250" y="49" font-family="Arial, Liberation Sans, sans-serif" font-size="30" fill="#172d3d" font-weight="500" text-anchor="start">Streaming reconstruction across shot changes</text>
<line x1="30" y1="80" x2="1770" y2="80" stroke="#dce3e9" stroke-width="1"/>
<!-- Conceptual illustration — not an experimental result：概念示意图，并非实验结果 -->
<text x="1770" y="114" font-family="Arial, Liberation Sans, sans-serif" font-size="22" fill="#657685" font-weight="400" text-anchor="end">Conceptual illustration — not an experimental result</text>
<rect x="30" y="139" width="1740" height="397" rx="12" fill="#f5f8fa" stroke="#d5dfe5" stroke-width="1"/>
<!-- ONE SHARED WORLD：统一世界坐标系 -->
<text x="68" y="181" font-family="Arial, Liberation Sans, sans-serif" font-size="23" fill="#172d3d" font-weight="600" text-anchor="start">ONE SHARED WORLD</text>
<circle cx="1330" cy="177" r="7" fill="#e86755"/>
<text x="1348" y="185" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#172d3d" font-weight="400" text-anchor="start">Person 1</text>
<circle cx="1462" cy="177" r="7" fill="#14a6a0"/>
<text x="1480" y="185" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#172d3d" font-weight="400" text-anchor="start">Person 2</text>
<circle cx="1594" cy="177" r="7" fill="#8569d0"/>
<text x="1612" y="185" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#172d3d" font-weight="400" text-anchor="start">Person 3</text>
<!-- Generated scene / illustration placeholder：生成式场景或插画占位区 -->
<text x="900" y="305" font-family="Arial, Liberation Sans, sans-serif" font-size="34" fill="#657685" font-weight="400" text-anchor="middle">Generated scene / illustration placeholder</text>
<!-- Replace this panel with your conceptual artwork：将此区域替换为你的概念绘图 -->
<text x="900" y="349" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#657685" font-weight="400" text-anchor="middle">Replace this panel with your conceptual artwork</text>
<!-- Keep the same person colors across shots：人物颜色在各镜头间保持一致 -->
<text x="900" y="399" font-family="Arial, Liberation Sans, sans-serif" font-size="23" fill="#14a6a0" font-weight="600" text-anchor="middle">Keep the same person colors across shots</text>
<rect x="164" y="450" width="48" height="31" rx="4" fill="white" stroke="#3371ca" stroke-width="2"/>
<line x1="212" y1="457" x2="234" y2="448" stroke="#3371ca" stroke-width="2"/>
<line x1="234" y1="448" x2="234" y2="483" stroke="#3371ca" stroke-width="2"/>
<line x1="234" y1="483" x2="212" y2="475" stroke="#3371ca" stroke-width="2"/>
<line x1="188" y1="488" x2="188" y2="531" stroke="#3371ca" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="865" y="450" width="48" height="31" rx="4" fill="white" stroke="#df9525" stroke-width="2"/>
<line x1="913" y1="457" x2="935" y2="448" stroke="#df9525" stroke-width="2"/>
<line x1="935" y1="448" x2="935" y2="483" stroke="#df9525" stroke-width="2"/>
<line x1="935" y1="483" x2="913" y2="475" stroke="#df9525" stroke-width="2"/>
<line x1="889" y1="488" x2="889" y2="531" stroke="#df9525" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="1553" y="450" width="48" height="31" rx="4" fill="white" stroke="#8569d0" stroke-width="2"/>
<line x1="1601" y1="457" x2="1623" y2="448" stroke="#8569d0" stroke-width="2"/>
<line x1="1623" y1="448" x2="1623" y2="483" stroke="#8569d0" stroke-width="2"/>
<line x1="1623" y1="483" x2="1601" y2="475" stroke="#8569d0" stroke-width="2"/>
<line x1="1577" y1="488" x2="1577" y2="531" stroke="#8569d0" stroke-width="1.5" stroke-dasharray="5 5"/>
<!-- Illustrated monocular input stream：示意性的单目输入时间流 -->
<text x="30" y="587" font-family="Arial, Liberation Sans, sans-serif" font-size="25" fill="#172d3d" font-weight="600" text-anchor="start">Illustrated monocular input stream</text>
<rect x="30" y="612" width="570" height="202" rx="9" fill="#f5f8fa" stroke="#d5dfe5" stroke-width="1"/>
<rect x="31" y="613" width="568" height="4" rx="0" fill="#3371ca" stroke="none" stroke-width="1"/>
<!-- Shot 1：镜头 1 -->
<text x="315" y="652" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#3371ca" font-weight="600" text-anchor="middle">Shot 1</text>
<!-- Input illustration placeholder：输入示意图占位区 -->
<text x="315" y="729" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#657685" font-weight="400" text-anchor="middle">Input illustration placeholder</text>
<rect x="615" y="612" width="570" height="202" rx="9" fill="#f5f8fa" stroke="#d5dfe5" stroke-width="1"/>
<rect x="616" y="613" width="568" height="4" rx="0" fill="#df9525" stroke="none" stroke-width="1"/>
<!-- Shot 2：镜头 2 -->
<text x="900" y="652" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#df9525" font-weight="600" text-anchor="middle">Shot 2</text>
<!-- Input illustration placeholder：输入示意图占位区 -->
<text x="900" y="729" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#657685" font-weight="400" text-anchor="middle">Input illustration placeholder</text>
<rect x="1200" y="612" width="570" height="202" rx="9" fill="#f5f8fa" stroke="#d5dfe5" stroke-width="1"/>
<rect x="1201" y="613" width="568" height="4" rx="0" fill="#8569d0" stroke="none" stroke-width="1"/>
<!-- Shot 3：镜头 3 -->
<text x="1485" y="652" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#8569d0" font-weight="600" text-anchor="middle">Shot 3</text>
<!-- Input illustration placeholder：输入示意图占位区 -->
<text x="1485" y="729" font-family="Arial, Liberation Sans, sans-serif" font-size="24" fill="#657685" font-weight="400" text-anchor="middle">Input illustration placeholder</text>
<rect x="559" y="765" width="96" height="30" rx="0" fill="white" stroke="none" stroke-width="1"/>
<!-- Shot cut：镜头切换 -->
<text x="607" y="787" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#df9525" font-weight="600" text-anchor="middle">Shot cut</text>
<rect x="1144" y="765" width="96" height="30" rx="0" fill="white" stroke="none" stroke-width="1"/>
<!-- Shot cut：镜头切换 -->
<text x="1192" y="787" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#df9525" font-weight="600" text-anchor="middle">Shot cut</text>
<line x1="30" y1="844" x2="1767" y2="844" stroke="#657685" stroke-width="1.5" marker-end="url(#arrow)"/>
<!-- Time：时间 -->
<text x="1770" y="873" font-family="Arial, Liberation Sans, sans-serif" font-size="20" fill="#657685" font-weight="400" text-anchor="end">Time</text>
</svg>